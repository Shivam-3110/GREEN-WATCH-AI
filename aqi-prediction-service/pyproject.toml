[project]
name = "aqi-prediction-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Shivam-3110", email = "mrshivam00022@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.5",
    "joblib>=1.4.2",
    "numpy>=1.26.4",
    "pandas>=2.2.2",
    "pyarrow>=25.0.1,<26",
    "pydantic==2.10.5",
    "python-dotenv==1.0.1",
    "requests==2.32.3",
    "scikit-learn>=1.9.1",
    "uvicorn[standard]==0.34.0",
    "xgboost>=3.2.0",
]

[project.scripts]
aqi-prediction-service = "aqi_prediction_service:main"

[build-system]
requires = ["uv_build>=0.12.20,<0.13.0"]
build-backend = "uv_build"
